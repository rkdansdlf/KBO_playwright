# Local-only override for `docker-compose.dev.yml` (Windows/Docker Desktop host).
#
# 127.0.0.1 inside a container is the container itself, so services reach
# the host databases via explicit host IPs. Credentials come from `.env`
# (`BEGA_PROD_PASSWORD`) — this file contains no secrets and is safe to share.
#
# Start with:
#   docker compose -f docker-compose.dev.yml -f docker-compose.local.yml up -d api-server
#
services:
  scheduler:
    environment:
      DATABASE_URL: postgresql+psycopg2://bega_prod_user:${BEGA_PROD_PASSWORD}@100.81.73.13:5432/bega_prod
      # Temporary safe-operation profile (2026-10-16): no startup backfill and
      # no automatic remediation until the historical-write guards are verified
      # in production. See issue #32.
      STARTUP_RUN: "0"
      DAILY_AUTO_REMEDIATION: "0"
      RECOVERY_LOOKBACK_DAYS: "14"
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./docs:/app/docs
  api-server:
    environment:
      DATABASE_URL: postgresql+psycopg2://bega_prod_user:${BEGA_PROD_PASSWORD}@100.81.73.13:5432/bega_prod
  # Pinned digests in docker-compose.dev.yml drifted from locally cached
  # images and the registry is unreachable from here — use local images.
  browserless:
    image: ghcr.io/browserless/chromium:latest
  prometheus:
    image: prom/prometheus:latest
  alertmanager:
    image: prom/alertmanager:v0.33.1
  grafana:
    image: grafana/grafana:latest

  # Local RAG vector store, promoted from a manual `docker run` on
  # 2026-10-09 (container `kbo-pgvector`, data volume `kbo_pgvector`,
  # host port 55433). It holds the backfilled `kbo_rag.rag_chunks`.
  # The volume is external so adopting it never re-initializes the DB;
  # `POSTGRES_PASSWORD` is only read on first init. The value lives in
  # `.env` (`PGVECTOR_LOCAL_PASSWORD`) because this file must stay
  # secret-free. Consumers keep using host port 55433 — no URL change.
  rag-vectors:
    image: pgvector/pgvector:pg16
    restart: always
    container_name: kbo-pgvector
    environment:
      POSTGRES_DB: kbo_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGVECTOR_LOCAL_PASSWORD:?PGVECTOR_LOCAL_PASSWORD must be set in .env}
    ports:
      - "55433:5432"
    volumes:
      - kbo_pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kbo_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kbo_pgvector:
    external: true
