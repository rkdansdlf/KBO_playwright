name: Security Audit

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/security-audit-allowlist.txt'
      - 'Dockerfile'
      - 'Dockerfile.playwright'
      - '.github/workflows/security_audit.yml'
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/security-audit-allowlist.txt'
      - 'Dockerfile'
      - 'Dockerfile.playwright'
  schedule:
    - cron: '0 21 * * 0'  # 일요일 06:00 KST (토 21:00 UTC)
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Deliberately not kbo-job-setup: that action installs the dev extras and
      # would make the audit report dev-only pins. This job audits the runtime
      # set, so it installs uv itself and syncs the locked runtime dependencies.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Auditing what CI actually runs. A plain pip install of the project
      # re-resolved the version ranges here, so this job could pass on a
      # dependency set no other job ever installs.
      - name: Install the locked runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          export UV_PROJECT_ENVIRONMENT="$(python3 -c 'import sys; print(sys.prefix)')"
          uv sync --frozen --no-dev

      - name: Install pip-audit
        run: pip install pip-audit

      # A finding fails the job. `.github/security-audit-allowlist.txt` is the
      # only escape hatch, and every entry there needs a reason and an expiry.
      - name: Run pip-audit
        run: |
          set -euo pipefail
          ignore_args=()
          allowlist=".github/security-audit-allowlist.txt"
          if [ -s "$allowlist" ]; then
            while read -r entry || [ -n "$entry" ]; do
              entry="${entry%%#*}"
              entry="$(printf '%s' "$entry" | tr -d '[:space:]')"
              [ -z "$entry" ] && continue
              ignore_args+=(--ignore-vuln "$entry")
            done < "$allowlist"
          fi
          pip-audit --local --desc on "${ignore_args[@]}" 2>&1 | tee pip-audit-output.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report-${{ github.run_number }}
          path: pip-audit-output.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Read audit output
        if: always()
        id: output
        run: |
          if [ -f pip-audit-output.txt ]; then
            {
              echo "output<<EOF"
              cat pip-audit-output.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "output=pip-audit passed with no findings" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/notify
        if: always()
        with:
          status: ${{ job.status }}
          workflow: 'Dependency Security Audit'
          channels: telegram
