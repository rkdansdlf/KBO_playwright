name: KBO Daily Pipeline

on:
  # schedule:
  #   - cron: '0 18 * * *'  # 03:00 KST (Disabled automated run)
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYYMMDD or YYYY-MM-DD). Defaults to previous day in KST.'
        required: false
        default: ''

concurrency:
  group: kbo-db-write-operations
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ORACLE_WALLET_B64: ${{ secrets.ORACLE_WALLET_B64 }}
  OCI_WALLET_PASSWORD: ${{ secrets.OCI_WALLET_PASSWORD }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 — Postgame Finalize (03:00 KST) + Standings + Defense + Rankings
  # ──────────────────────────────────────────────────────────────────────────
  finalize:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.job-setup.outputs.KST_DATE }}
      year: ${{ steps.job-setup.outputs.KST_YEAR }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/kbo-job-setup
        id: job-setup
        with:
          playwright: 'true'
          init-db: 'true'
          resolve-date: 'true'
          target-date: ${{ github.event.inputs.target_date || '' }}

      - name: Validate Environment Configuration & Diagnostics
        run: |
          python3 -m src.cli.kbo config --env ci --strict
          python3 -m src.cli.kbo diagnose --subsystem db

      - name: Verify target-date game completeness before publish (local, preflight)
        id: preflight_local
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python3 scripts/verification/audit_daily_completeness.py \
            --date "${{ steps.job-setup.outputs.KST_DATE }}" \
            --include-incomplete \
            --strict

      - name: Data Quality Regression Pack (local, preflight)
        id: regression_pack_local
        continue-on-error: true
        run: |
          python3 -m src.cli.data_quality_regression_pack \
            --date "${{ steps.job-setup.outputs.KST_DATE }}" \
            --year "${{ steps.job-setup.outputs.KST_YEAR }}" \
            --require-schema \
            --json \
            --output "$RUNNER_TEMP/data_quality_regression_local.json"

      - name: Run Master Daily Sync DAG Workflow
        env:
          KBO_USER_ID: ${{ secrets.KBO_USER_ID }}
          KBO_USER_PWD: ${{ secrets.KBO_USER_PWD }}
        run: |
          python3 -m src.cli.kbo workflow \
            --workflow daily_sync \
            --date "${{ steps.job-setup.outputs.KST_DATE }}"

      - name: Verify target-date game completeness after publish (local, post-run)
        id: postsync_local
        run: |
          python3 scripts/verification/audit_daily_completeness.py \
            --date "${{ steps.job-setup.outputs.KST_DATE }}" \
            --include-incomplete \
            --strict

      - name: Data Quality Regression Pack (local, post-run)
        run: |
          python3 -m src.cli.data_quality_regression_pack \
            --date "${{ steps.job-setup.outputs.KST_DATE }}" \
            --year "${{ steps.job-setup.outputs.KST_YEAR }}" \
            --require-schema \
            --json \
            --output "$RUNNER_TEMP/data_quality_regression_postrun.json"

      - name: Upload Data Quality Regression Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-regression-${{ steps.job-setup.outputs.KST_DATE }}
          path: ${{ runner.temp }}/data_quality_regression_*.json
          if-no-files-found: warn

      - uses: ./.github/actions/notify
        if: always()
        with:
          status: ${{ job.status }}
          workflow: 'Postgame Finalize'
          channels: telegram

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 — PBP Healer + Batch Parse (04:30-05:00 KST)
  # ──────────────────────────────────────────────────────────────────────────
  post-process:
    needs: finalize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/kbo-job-setup
        with:
          playwright: 'true'
          init-db: 'true'

      - name: Heal Unverified PBP
        run: |
          python3 -m src.cli.auto_healer --lookback-days 3

      - name: Batch Parse Snapshots
        run: |
          python3 scripts/batch_parse_snapshots.py

      - uses: ./.github/actions/notify
        if: always()
        with:
          status: ${{ job.status }}
          workflow: 'PBP Healer & Batch Parse'
          channels: telegram

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 — Quality Report + Gap Report (05:15-05:30 KST)
  # ──────────────────────────────────────────────────────────────────────────
  quality:
    needs: [finalize, post-process]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/kbo-job-setup
        with:
          init-db: 'true'

      - name: Generate Unified Quality Report
        run: |
          python3 -m src.cli.kbo report \
            --category quality \
            --date ${{ needs.finalize.outputs.date }} \
            --format markdown

      - name: Run Statistical Anomaly Detection
        run: |
          python3 -m src.cli.kbo detect \
            --sensitivity medium \
            --json

      - name: Quality Dashboard
        run: |
          python3 -m src.cli.quality_dashboard --limit 14 --json

      - name: Trend Tracker Check
        run: |
          python3 -c "
          from src.monitoring.trend_tracker import TrendTracker
          TrendTracker().send_degradation_alert(days=14)
          "

      - name: Run Gap Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_RELAY: ${{ secrets.TELEGRAM_CHAT_ID_RELAY || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_STANDINGS: ${{ secrets.TELEGRAM_CHAT_ID_STANDINGS || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_PROFILE: ${{ secrets.TELEGRAM_CHAT_ID_PROFILE || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FRESHNESS: ${{ secrets.TELEGRAM_CHAT_ID_FRESHNESS || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -m src.cli.kbo report --category gap

      - name: Data Freshness Monitor
        run: |
          python3 -m src.cli.monitor_data_freshness

      - name: Quality Gate
        run: |
          python3 -m src.cli.quality_gate_check \
            --year ${{ needs.finalize.outputs.year }}

      - name: Recalc Player-Game Stats
        run: |
          python3 -m src.cli.recalc_player_game_stats \
            --date ${{ needs.finalize.outputs.date }} \
            --save

      - name: Verify PlayerGame Data Quality
        run: |
          python3 -m scripts.verification.verify_player_game_stats \
            --date ${{ needs.finalize.outputs.date }} \
            --exit-code

      - name: Comprehensive Data Integrity Audit (full_audit)
        continue-on-error: true
        run: |
          python3 -m scripts.maintenance.full_audit \
            --json --no-write

      - name: Season Completeness Audit
        continue-on-error: true
        run: |
          python3 -m scripts.maintenance.audit_completeness \
            --start-year ${{ needs.finalize.outputs.year }} \
            --end-year ${{ needs.finalize.outputs.year }} \
            --json \
            --output "$RUNNER_TEMP/completeness_audit.json"

      - name: Upload Completeness Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completeness-audit-${{ needs.finalize.outputs.date }}
          path: ${{ runner.temp }}/completeness_audit.json
          if-no-files-found: warn

      - uses: ./.github/actions/notify
        if: always()
        with:
          status: ${{ job.status }}
          workflow: 'Quality & Gap Report'
          channels: telegram

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4 — Advanced Daily Sync
  # ──────────────────────────────────────────────────────────────────────────
  advanced-sync:
    needs: [finalize, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/kbo-job-setup
        with:
          playwright: 'true'
          init-db: 'true'

      - name: Run Advanced Daily
        run: |
          python3 -m src.cli.run_advanced_daily \
            --year ${{ needs.finalize.outputs.year }}

      - name: Crawl KBO Press Releases & Notices
        run: |
          python3 -m src.cli.crawl_press_releases --save --max-pages 1

      - name: Crawl Milestones & Futures Schedule
        run: |
          python3 -m src.cli.crawl_milestones --season ${{ needs.finalize.outputs.year }} --save
          python3 -m src.cli.crawl_futures_schedule --year ${{ needs.finalize.outputs.year }} --save

      - name: Crawl Player Splits & Rookie Drafts
        run: |
          python3 -m src.cli.crawl_player_splits --season ${{ needs.finalize.outputs.year }} --save
          python3 -m src.cli.crawl_player_drafts --season ${{ needs.finalize.outputs.year }} --save

      - name: Recalc Milestones & Index RAG Knowledge
        run: |
          python3 -m src.cli.recalc_milestones --season ${{ needs.finalize.outputs.year }}
          python3 -m src.cli.index_rag_knowledge --season ${{ needs.finalize.outputs.year }}

      - name: Dispatch Daily KBO Pregame & Milestone Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -m src.cli.send_today_pregame_alerts --season ${{ needs.finalize.outputs.year }} --channels telegram
          python3 -m src.cli.send_milestone_daily_summary --season ${{ needs.finalize.outputs.year }} --channels telegram


      - name: Run Automated Maintenance (PA Formula & Null IDs)
        run: |
          python3 -m src.cli.kbo maintenance --task all --apply

      - name: Incremental OCI Cloud Data Lake Sync
        run: |
          python3 -m src.cli.kbo sync --apply --mode incremental

      - name: Reference Integrity Gate
        run: |
          python3 scripts/verification/check_orphan_data.py \
            --strict --json --sample-limit 20

      - name: Completeness Audit
        if: always()
        run: |
          python3 scripts/verification/audit_daily_completeness.py \
            --days 14

      - name: Freshness Gate (Extended Window)
        if: always()
        run: |
          python3 -m src.cli.freshness_gate \
            --days 14

      - uses: ./.github/actions/notify
        if: always()
        with:
          status: ${{ job.status }}
          channels: telegram
