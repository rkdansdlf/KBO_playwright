name: KBO Periodic Extras

on:
  # schedule:
  #   - cron: '0 21 1 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year for futures stats'
        required: false
        default: ''

concurrency:
  group: kbo-periodic-extras
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ORACLE_WALLET_B64: ${{ secrets.ORACLE_WALLET_B64 }}
  OCI_WALLET_PASSWORD: ${{ secrets.OCI_WALLET_PASSWORD }}

jobs:
  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/kbo-job-setup
        with:
          playwright: 'true'
          init-db: 'true'

      - name: Run Periodic Extras
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then
            YEAR="$(TZ='Asia/Seoul' date +'%Y')"
          fi
          python3 -m src.cli.run_periodic_extras --year "$YEAR"

      - name: Refresh Award History (Wiki + Yagoonara)
        run: |
          python3 -m src.cli.seed_data_sources
          python3 -m src.cli.crawl_awards --save

      - name: Monthly Unified Audit (PA Formula + Team Stats)
        run: |
          YEAR="$(TZ='Asia/Seoul' date +'%Y')"
          PREV_YEAR=$(( YEAR - 1 ))
          python3 -m src.cli.monthly_unified_audit --year "$PREV_YEAR"
          python3 -m src.cli.monthly_unified_audit --year "$YEAR"

      - uses: ./.github/actions/notify
        if: always()
        with:
          status: ${{ job.status }}
          channels: telegram
