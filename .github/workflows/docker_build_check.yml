name: Docker Build Check

# PR-stage check that the runtime image still builds. Nothing is pushed; the
# push pipeline is docker_build.yml and only runs on main.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docker/**'
      - '.dockerignore'
      - 'src/**'
      - '.github/workflows/docker_build_check.yml'
  workflow_dispatch:

concurrency:
  group: docker-build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image (no push)
        run: docker build -f Dockerfile -t kbo-playwright:ci .
