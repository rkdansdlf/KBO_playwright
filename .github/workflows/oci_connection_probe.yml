name: OCI Connection Probe (read-only)

# 크롤러 저장소(KBO_playwright)의 .github/workflows/ 에 놓고 쓴다.
#
# 목적: 크롤러 GitHub Secrets 로 새 ADB(ETYQPNPJ0L1EP777)에 붙는지만 확인한다.
# 로컬 .env 의 Oracle 비밀번호는 2026-08 로테이션 이후 값이 아니어서 ORA-01017 이
# 나는데(2026-08-27 확인), 크롤러 시크릿(OCI_DB_URL, 08-17 갱신)은 유효할 가능성이 높다.
#
# oci_live_verification.yml 에서 쓰기 스텝(Apply/Reapply/Audit/E2E)을 전부 뺀 것이다.
# 스키마를 만들지도, 데이터를 쓰지도 않는다.

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe Oracle ADB connection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCI_DB_URL: ${{ secrets.OCI_DB_URL }}
      ORACLE_WALLET_B64: ${{ secrets.ORACLE_WALLET_B64 }}
      OCI_WALLET_PASSWORD: ${{ secrets.OCI_WALLET_PASSWORD }}
      TNS_ADMIN: ${{ github.workspace }}/wallet

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/kbo-job-setup
        with:
          init-db: 'false'

      - name: Prepare Oracle Wallet
        run: |
          test -n "$OCI_DB_URL"
          test -n "$ORACLE_WALLET_B64"
          mkdir -p "$TNS_ADMIN"
          printf '%s' "$ORACLE_WALLET_B64" | base64 --decode > "$RUNNER_TEMP/oracle-wallet.zip"
          unzip -oq "$RUNNER_TEMP/oracle-wallet.zip" -d "$TNS_ADMIN"
          echo "wallet files: $(ls -1 "$TNS_ADMIN" | wc -l)"

      - name: Probe (read-only --check)
        run: |
          set +e
          python3 -m src.cli.apply_oracle_migrations --url "$OCI_DB_URL" --check 2>&1 | tee probe.log
          set -e

      - name: Classify result
        if: always()
        run: |
          echo "--- 판정 ---"
          if   grep -qiE 'ORA-12506|ORA-12514|DPY-6000|listener refused' probe.log; then
            echo "ACL/리스너 차단 -> ADB 네트워크 설정 확인"
          elif grep -qiE 'ORA-01017|invalid cred'                        probe.log; then
            echo "자격증명 실패 -> 크롤러 시크릿도 로테이션 이전 값이다"
          elif grep -qiE 'sqlite|kbo_dev\.db'                            probe.log; then
            echo "SQLite 폴백 -> URL 이 전달되지 않았다"
          elif grep -qiE 'pending|not applied|ORA-00942'                 probe.log; then
            echo "접속 성공. 스키마 pending -> apply_oracle_migrations 가 다음 단계"
          else
            echo "접속 성공, 마이그레이션 최신 상태"
          fi
