name: Test Suite
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-suite-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/kbo-job-setup
        with:
          python-version: "3.12"
          init-db: 'false'
      - name: Install lint dependencies
        run: pip install ruff==0.16.9 pre-commit
      - name: Ruff lint check
        run: ruff check --output-format=github src/ tests/ scripts/ tools/ 2>&1
      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/ tools/ 2>&1
      - name: Bare except lint check
        run: python scripts/lint_bare_except.py 2>&1
      - name: Crawler HTTP client bypass check
        run: python scripts/lint_crawler_client_bypass.py 2>&1
      - name: Module-level .env load check
        run: python scripts/lint_module_level_dotenv.py 2>&1
      - name: Alert transport bypass check
        run: python scripts/lint_alert_transport_bypass.py 2>&1
      - name: Notification layering check
        run: python scripts/lint_notification_layering.py 2>&1
      - name: Unreachable code lint check
        run: python scripts/lint_unreachable_code.py 2>&1
      - name: Unreferenced public symbol lint check
        run: python scripts/lint_unused_defs.py 2>&1
      - name: Scoped mypy gate (certified-clean modules)
        run: python scripts/check_mypy_scoped.py 2>&1
      - name: Verify repository transaction ownership
        run: python scripts/audit_transaction_ownership.py 2>&1
      - name: Master CLI Smoke & Config Gate Check
        env:
          DATABASE_URL: "sqlite:///:memory:"
          TELEGRAM_BOT_TOKEN: "ci-placeholder"
        run: |
          python3 -m src.cli.kbo --help
          python3 -m src.cli.kbo config --env ci --strict
      - name: Agent Harness manifest and policy gate
        run: python3 -m tools.agent_harness doctor --json
      - name: Workflow YAML lint
        run: |
          if command -v actionlint >/dev/null 2>&1; then
            actionlint
          else
            echo "actionlint not installed, skipping"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Pinned so the firing fixtures are verified by the same promtool that was
      # used to write them. `test_promtool_is_available_where_it_matters` fails if
      # this stops being installed, which is the only thing that stops the skip
      # below from quietly returning.
      PROMTOOL_VERSION: "3.15.0"
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/kbo-job-setup
        with:
          python-version: ${{ matrix.python-version }}
          playwright: "true"
          init-db: 'false'
      - name: Prepare test data directory
        run: mkdir -p data
      - name: Initialize test DB
        run: python -c "from src.db.engine import init_db; init_db()"
        env:
          DATABASE_URL: sqlite:///./data/kbo_dev.db
      - name: Clean stale test DBs
        run: find data -maxdepth 1 -type f -name 'test_runtime*.db*' -delete
      - name: Crawler adoption contract check
        # The matrix classifies crawlers by reading their source, so it is a
        # contract about the code rather than a report about a database. It
        # exits non-zero when the declared adoption disagrees with the source --
        # a crawler claiming a dead letter queue it does not enqueue, or closing
        # the whole chain with no declared design. Un-gated, that drift sat in
        # the tree unnoticed while the matrix kept rendering it.
        #
        # It lives in this job rather than `lint` because importing the CLI pulls
        # in `src/crawlers/__init__.py`, which needs httpx, playwright and
        # sqlalchemy; the lint job installs ruff alone.
        run: python -m src.cli.reports.crawler_adoption_matrix --output reports/crawler_adoption_matrix.md
      - name: Check the crawl source declarations
        # What each crawler reads and writes, and whether the declarations still
        # match reality. `--no-db` is deliberate: this job's database is SQLite,
        # so measurements would all read UNKNOWN and the drift gate would fire on
        # tables it simply cannot see. Table freshness is a production
        # observation; what belongs here is the code contract -- that every
        # declared table exists in the models, every declared crawler exists, and
        # every blocked crawler records where else the data could come from.
        run: python -m src.cli.reports.crawler_source_inventory --no-db --fail-on-drift
      - name: Check captured crawler selectors
        # Twelve captured KBO pages, held against the selectors the crawlers
        # actually read. This is the same chain as the adoption matrix a step
        # earlier and for the same reason: both are contracts about code, not
        # reports about a database, so they belong in a job that runs the code.
        #
        # Every target is fixture-backed, so this never touches the network. It
        # has to be run here rather than left to whoever remembers, because the
        # failure it prevents is invisible from outside -- a renamed class turns
        # a sweep into a run that reports it read a page and stored nothing.
        #
        # The companion test (test_selector_gate_follows_the_crawlers.py) holds
        # this config against the crawler source, which is the half the gate
        # itself cannot do: a stale selector list would otherwise pass here
        # forever while guarding nothing.
        run: python -m src.cli.crawler_selector_gate --config Docs/references/crawler_selector_gate.json
      - name: Install promtool for alert-rule firing tests
        # Every alert rule in this repository has a promtool fixture proving it
        # fires on the data it should fire on and stays quiet on the data it
        # should not. Those tests skip when promtool is absent, and a skipped
        # test is a green test -- so without this step the runner verified
        # nothing about them while reporting success. The rules are wired to
        # metrics that are only emitted on paths that fail silently, which is
        # exactly the case where a broken rule looks identical to a healthy
        # pipeline.
        run: |
          set -euo pipefail
          url="https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz"
          curl -sSfL --retry 3 -o promtool.tar.gz "$url"
          mkdir -p "$RUNNER_TEMP/promtool"
          tar -xzf promtool.tar.gz -C "$RUNNER_TEMP/promtool" --strip-components=1 \
            "prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool"
          echo "$RUNNER_TEMP/promtool" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/promtool/promtool" --version
      - name: Run tests
        run: |
          set -o pipefail
          COVERAGE_FILE="$RUNNER_TEMP/kbo.coverage" pytest --tb=short -v --durations=10 --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml -n 2 2>&1 | tee pytest-unit.log

      - name: Upload unit test profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-unit-${{ matrix.python-version }}-${{ github.run_number }}
          path: pytest-unit.log
          retention-days: 30

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}-${{ github.run_number }}
          path: coverage.xml
          retention-days: 30

      - name: Coverage gate
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib['line-rate']) * 100
          print(f'Coverage: {line_rate:.1f}%')
          if line_rate < 75:
              raise SystemExit(f'Coverage {line_rate:.1f}% is below 75% threshold')
          "

  migration-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kbo_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kbo_migrations"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kbo-job-setup
        with:
          python-version: "3.12"
          playwright: "false"
          init-db: 'false'
      - name: Initialize PostgreSQL ORM baseline schema
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_migrations
        run: python -c "from src.db.engine import init_db; init_db()"
      - name: Verify PostgreSQL ORM baseline views
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_migrations
        run: python -c "from sqlalchemy import inspect; from src.db.engine import Engine; assert 'vw_player_season_batting_recalc' in inspect(Engine).get_view_names()"
      - name: Apply PostgreSQL incremental migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_migrations
        run: python3 -m src.cli.apply_postgres_migrations
      - name: Reapply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_migrations
        run: python3 -m src.cli.apply_postgres_migrations
      - name: Check PostgreSQL migrations are current
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_migrations
        run: python3 -m src.cli.apply_postgres_migrations --check

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: test
    if: always() && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/kbo-job-setup
        with:
          python-version: "3.12"
          playwright: "false"
          init-db: 'false'
      - name: Prepare test data directory
        run: mkdir -p data
      - name: Initialize test DB
        run: python -c "from src.db.engine import init_db; init_db()"
        env:
          DATABASE_URL: sqlite:///./data/kbo_dev.db
      - name: Run integration tests
        run: |
          set -o pipefail
          pytest -m integration --ignore=tests/crawlers/test_award_crawler.py --tb=short -v --durations=10 -n 1 2>&1 | tee pytest-integration-sqlite.log
        env:
          DATABASE_URL: sqlite:///./data/kbo_dev.db

      - name: Upload SQLite integration profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-integration-sqlite-${{ github.run_number }}
          path: pytest-integration-sqlite.log
          retention-days: 30

  integration-test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: test
    if: always() && needs.test.result == 'success'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kbo_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kbo_integration"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/kbo-job-setup
        with:
          python-version: "3.12"
          playwright: "false"
          init-db: 'false'
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_integration

      - name: Initialize PostgreSQL integration schema
        run: python -c "from src.db.engine import init_db; init_db()"
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_integration

      - name: Run PostgreSQL integration tests
        run: |
          set -o pipefail
          pytest -m integration --ignore=tests/crawlers/test_award_crawler.py --tb=short -v --durations=10 -n 1 2>&1 | tee pytest-integration-postgres.log
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_integration

      - name: Upload PostgreSQL integration profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-integration-postgres-${{ github.run_number }}
          path: pytest-integration-postgres.log
          retention-days: 30

  slow-no-network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: test
    if: always() && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/kbo-job-setup
        with:
          python-version: "3.12"
          playwright: "true"
          init-db: 'false'
      - name: Prepare test data directory
        run: mkdir -p data
      - name: Run slow tests without live-network flags
        run: |
          set -o pipefail
          pytest -m slow --tb=short -v --durations=10 -n 1 2>&1 | tee pytest-slow-no-network.log
        env:
          DATABASE_URL: sqlite:///./data/kbo_dev.db
          KBO_RUN_OCI_INTEGRATION: ""
          KBO_RUN_LIVE_BASIC2_HEADERS: ""
          RUN_LIVE_DEBUG_TESTS: ""
          NAVER_CLIENT_ID: ""
          NAVER_CLIENT_SECRET: ""

      - name: Upload slow test profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-slow-no-network-${{ github.run_number }}
          path: pytest-slow-no-network.log
          retention-days: 30

  rag-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: test
    if: always() && needs.test.result == 'success'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kbo_rag_primary
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kbo_rag_primary"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kbo_rag_vector
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kbo_rag_vector"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kbo-job-setup
        with:
          python-version: "3.12"
          playwright: "false"
          init-db: 'false'
      - name: Initialize primary evaluation schema
        env:
          RAG_TEST_DB_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_rag_primary
        run: python -c "from src.db.engine import init_db; init_db()"
      - name: Initialize pgvector evaluation schema
        env:
          PGVECTOR_TEST_URL: postgresql+psycopg2://postgres:postgres@localhost:5433/kbo_rag_vector
        run: python -c "from src.models.rag_chunk_vector import RagChunkVector; from src.db.vector_engine import init_vector_db; init_vector_db()"
      - name: Validate evaluation corpus and golden IDs
        run: python -m src.cli.bootstrap_rag_eval_corpus --json
      - name: Index evaluation corpus into both stores
        env:
          RAG_EVAL_ALLOW_WRITE: "1"
          RAG_TEST_DB_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_rag_primary
          PGVECTOR_TEST_URL: postgresql+psycopg2://postgres:postgres@localhost:5433/kbo_rag_vector
        run: python -m src.cli.bootstrap_rag_eval_corpus --apply --json
      - name: Audit sparse/vector identity
        env:
          RAG_TEST_DB_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_rag_primary
          PGVECTOR_TEST_URL: postgresql+psycopg2://postgres:postgres@localhost:5433/kbo_rag_vector
        run: python -m src.cli.audit_rag_index --require-nonempty --json
      - name: Evaluate retrieval variants
        env:
          RAG_TEST_DB_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kbo_rag_primary
          PGVECTOR_TEST_URL: postgresql+psycopg2://postgres:postgres@localhost:5433/kbo_rag_vector
          GIT_COMMIT: ${{ github.sha }}
        run: >-
          python -m src.cli.evaluate_rag_retrieval
          --dataset tests/fixtures/rag_corpus/golden_queries.json
          --corpus tests/fixtures/rag_corpus/documents.json
          --all-variants
          --require-corpus
          --embedding-mode deterministic
          --min-recall 0.50
          --min-mrr 0.50
          --output rag-retrieval-evaluation.json
          --json
      - name: Upload RAG acceptance artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rag-acceptance-${{ github.run_number }}
          path: rag-retrieval-evaluation.json
          retention-days: 30
