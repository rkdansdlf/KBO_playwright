name: Docker Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docker/**'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest + git-sha)'
        required: false
        default: ''

concurrency:
  group: docker-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this the job sat "in progress" for hours after the build itself
    # had stopped making progress. The text relay build caps at 120 minutes for
    # the same image family.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # No QEMU: the build has no `platforms:` input, so it is a single amd64
      # image and emulation is pure setup cost.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `mode=max` exports every intermediate layer of a Playwright-based
          # image, which runs the build past GitHub's cache quota and leaves the
          # export running long after the push finished. `mode=min` keeps the
          # final image layers, which is what makes the next build fast.
          cache-from: type=gha
          cache-to: type=gha,mode=min
