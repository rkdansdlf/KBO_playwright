name: KBO Pitcher Backfill

on:
  # schedule:
  #   - cron: '0 0 * * *'
  #   - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Number of days ahead to search for scheduled games'
        required: false
        default: '1'

concurrency:
  group: kbo-pitcher-backfill
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ORACLE_WALLET_B64: ${{ secrets.ORACLE_WALLET_B64 }}
  OCI_WALLET_PASSWORD: ${{ secrets.OCI_WALLET_PASSWORD }}

jobs:
  backfill-pitchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/kbo-job-setup
        id: job-setup
        with:
          playwright: 'true'
          init-db: 'true'
          resolve-date: 'true'
          date-roll: '0'

      - name: Resolve Backfill Window
        run: |
          DAYS_AHEAD="${{ github.event.inputs.days_ahead || '1' }}"
          echo "DAYS_AHEAD=${DAYS_AHEAD}" >> "$GITHUB_ENV"

      - name: Run Pregame Backfill
        env:
          KBO_USER_ID: ${{ secrets.KBO_USER_ID }}
          KBO_USER_PWD: ${{ secrets.KBO_USER_PWD }}
        run: |
          python3 -m src.cli.backfill_pregame_previews \
            --days-ahead "${DAYS_AHEAD}"

      - uses: ./.github/actions/notify
        if: always()
        with:
          status: ${{ job.status }}
          channels: telegram
