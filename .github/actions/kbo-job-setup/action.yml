name: 'KBO Job Setup'
description: 'Checkout, setup Python environment, and optionally resolve date'
inputs:
  python-version:
    description: 'Python version'
    required: false
    default: '3.12'
  playwright:
    description: 'Install Playwright browser'
    required: false
    default: 'false'
  init-db:
    description: 'Initialize database and seed metadata'
    required: false
    default: 'true'
  resolve-date:
    description: 'Resolve KST date outputs (for first job in pipeline)'
    required: false
    default: 'false'
  target-date:
    description: 'Target date override (YYYYMMDD or YYYY-MM-DD). Empty = current KST date rolled by date-roll.'
    required: false
    default: ''
  date-roll:
    description: 'Days to roll back for KST date (0=today, 1=yesterday). Default 1.'
    required: false
    default: '1'
outputs:
  KST_DATE:
    description: 'Resolved KST date (YYYYMMDD)'
    value: ${{ steps.date.outputs.KST_DATE }}
  KST_YEAR:
    description: 'Resolved KST year'
    value: ${{ steps.date.outputs.KST_YEAR }}

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/python-env
      with:
        python-version: ${{ inputs.python-version }}
        playwright: ${{ inputs.playwright }}
        init-db: ${{ inputs.init-db }}

    - name: Resolve target date in KST
      if: ${{ inputs.resolve-date == 'true' }}
      id: date
      shell: bash
      run: |
        if [ -n "${{ inputs.target-date }}" ]; then
          RAW_DATE="${{ inputs.target-date }}"
          if [[ "$RAW_DATE" == *-* ]]; then
            KST_DATE="${RAW_DATE//-/}"
          else
            KST_DATE="$RAW_DATE"
          fi
        else
          ROLL="${{ inputs.date-roll }}"
          if [ "$ROLL" = "0" ]; then
            KST_DATE="$(TZ='Asia/Seoul' date +'%Y%m%d')"
          else
            KST_DATE="$(TZ='Asia/Seoul' date -d "${ROLL} day ago" +'%Y%m%d')"
          fi
        fi
        if [[ ! "$KST_DATE" =~ ^[0-9]{8}$ ]]; then
          echo "Invalid target date format: ${KST_DATE}. expected YYYYMMDD." >&2
          exit 1
        fi
        echo "KST_DATE=${KST_DATE}" | tee -a $GITHUB_OUTPUT
        echo "KST_YEAR=${KST_DATE:0:4}" | tee -a $GITHUB_OUTPUT
