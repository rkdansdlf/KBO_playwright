name: 'KBO Python Env'
description: 'Setup Python, install dependencies, and optionally initialize the database'
inputs:
  python-version:
    description: 'Python version'
    required: false
    default: '3.12'
  playwright:
    description: 'Install Playwright browser'
    required: false
    default: 'false'
  init-db:
    description: 'Initialize database and seed metadata'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv pip install --system -r requirements.txt

    - name: Get Playwright version
      if: ${{ inputs.playwright == 'true' }}
      id: playwright-version
      shell: bash
      run: |
        PLAYWRIGHT_VERSION=$(python3 -m playwright --version | awk '{print $2}')
        echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

    - name: Cache Playwright browsers
      id: cache-playwright
      if: ${{ inputs.playwright == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright
      if: ${{ inputs.playwright == 'true' }}
      shell: bash
      run: |
        if [ "${{ steps.cache-playwright.outputs.cache-hit }}" == "true" ]; then
          playwright install-deps chromium
         else
           playwright install --with-deps chromium
         fi

    - name: Prepare Oracle Wallet
      if: ${{ inputs.init-db == 'true' }}
      shell: bash
      run: |
        if [[ "${DATABASE_URL:-}" != oracle* ]]; then
          exit 0
        fi
        if [[ -n "${TNS_ADMIN:-}" && -f "$TNS_ADMIN/tnsnames.ora" ]]; then
          exit 0
        fi
        if [ -z "${ORACLE_WALLET_B64:-}" ]; then
          echo "ORACLE_WALLET_B64 is required when DATABASE_URL targets Oracle." >&2
          exit 1
        fi
        WALLET_DIR="$RUNNER_TEMP/oracle-wallet"
        mkdir -p "$WALLET_DIR"
        printf '%s' "$ORACLE_WALLET_B64" | base64 --decode > "$RUNNER_TEMP/oracle-wallet.zip"
        unzip -oq "$RUNNER_TEMP/oracle-wallet.zip" -d "$WALLET_DIR"
        echo "TNS_ADMIN=$WALLET_DIR" >> "$GITHUB_ENV"

    - name: Initialize Database & Seed Metadata
      if: ${{ inputs.init-db == 'true' }}
      shell: bash
      run: |
        if [ -z "${DATABASE_URL:-}" ]; then
          echo "DATABASE_URL must be configured for database initialization." >&2
          exit 1
        fi
        if [[ "$DATABASE_URL" == oracle* ]]; then
          python3 -m src.cli.apply_oracle_migrations
        else
          python3 -c "from src.db.engine import init_db; init_db()"
        fi
        python3 -m scripts.maintenance.seed_data
