name: 'KBO Python Env'
description: 'Setup Python, install dependencies, and optionally initialize the database'
inputs:
  python-version:
    description: 'Python version'
    required: false
    default: '3.12'
  playwright:
    description: 'Install Playwright browser'
    required: false
    default: 'false'
  init-db:
    description: 'Initialize database and seed metadata'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv pip install --system -r requirements.txt

    - name: Get Playwright version
      if: ${{ inputs.playwright == 'true' }}
      id: playwright-version
      shell: bash
      run: |
        PLAYWRIGHT_VERSION=$(python3 -m playwright --version | awk '{print $2}')
        echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

    - name: Cache Playwright browsers
      id: cache-playwright
      if: ${{ inputs.playwright == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright
      if: ${{ inputs.playwright == 'true' }}
      shell: bash
      run: |
        if [ "${{ steps.cache-playwright.outputs.cache-hit }}" == "true" ]; then
          playwright install-deps chromium
        else
          playwright install --with-deps chromium
        fi

    - name: Initialize Database & Seed Metadata
      if: ${{ inputs.init-db == 'true' }}
      shell: bash
      run: |
        python3 -c "from src.db.engine import init_db; init_db()"
        python3 -m scripts.maintenance.seed_data
