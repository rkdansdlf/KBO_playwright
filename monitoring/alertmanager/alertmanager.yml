global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'kbo-alerts-default'
  routes:
    - match:
        severity: critical
      receiver: 'kbo-alerts-critical'

receivers:
  - name: 'kbo-alerts-default'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: 'HTML'
    slack_configs:
      - channel: '#kbo-alerts'
        api_url: '${SLACK_WEBHOOK_URL}'
        send_resolved: true

  - name: 'kbo-alerts-critical'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: 'HTML'
    slack_configs:
      - channel: '#kbo-alerts-critical'
        api_url: '${SLACK_WEBHOOK_URL}'
        send_resolved: true
