global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'kbo-alerts-default'
  routes:
    - match:
        severity: critical
      receiver: 'kbo-alerts-critical'

receivers:
  - name: 'kbo-alerts-default'
    telegram_configs:
      - bot_token_file: '/run/secrets/telegram_bot_token'
        chat_id_file: '/run/secrets/telegram_chat_id'
        parse_mode: 'HTML'

  - name: 'kbo-alerts-critical'
    telegram_configs:
      - bot_token_file: '/run/secrets/telegram_bot_token'
        chat_id_file: '/run/secrets/telegram_chat_id'
        parse_mode: 'HTML'
