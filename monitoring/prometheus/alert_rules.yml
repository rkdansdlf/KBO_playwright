groups:
  - name: kbo_scheduler_alerts
    rules:
      - alert: KBOLockSkipSpike
        expr: sum(increase(kbo_scheduler_lock_skip_total[5m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "KBO 스케줄러 락 스킵(경합) 급증 발생"
          description: "최근 5분 동안 락 스킵 횟수가 {{ $value }}회 발생했습니다."

      - alert: KBOSchedulerJobFailed
        expr: increase(kbo_scheduler_job_total{status="failure"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "KBO 스케줄러 작업 실패"
          description: "스케줄러 작업 {{ $labels.job_id }} 이(가) 실패했습니다."

      # Both rules above are conditioned on activity. `increase()` over a window
      # is exactly what a job stops producing when it stops firing, and the
      # window then ages the last increment out and *resolves* the alert the job
      # had raised. So the pipeline going quiet -- the failure that actually
      # happened -- was the one thing neither rule could report.
      #
      # These two watch absence instead. Down is one series (`up`); stale is an
      # age (`time() - last submission`) measured against the job's own cadence,
      # which `kbo_scheduler_job_expected_interval_seconds` exports from the
      # trigger. That is why no window and no exemption list appear here: a fixed
      # window cannot serve both an every-ten-minute job and a monthly one, and
      # an exemption list is a second copy of the schedule that goes stale the
      # next time the schedule changes.
      #
      # The cadence is the *longest* gap a trigger leaves, so 1.5 misses one
      # firing of a daily job (36h) and two of an every-fifteen-minute job (22m).
      - alert: KBOSchedulerDown
        expr: up{job="kbo-scheduler"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "KBO 스케줄러 메트릭 수집 중단"
          description: "Prometheus가 스케줄러({{ $labels.instance }})를 10분 이상 스크레이프하지 못했습니다. 컨테이너 상태와 PROMETHEUS_PORT(기본 8000) 리스닝을 확인하세요. 이 규칙이 침묵하면 스케줄러·크롤러 알림 대부분이 함께 침묵합니다."
          runbook: "Docs/runbooks/DATA_RELIABILITY.md"

      - alert: KBOSchedulerJobNotRunning
        expr: time() - kbo_scheduler_job_last_run_timestamp > 1.5 * kbo_scheduler_job_expected_interval_seconds
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "KBO 스케줄러 작업 미발화: {{ $labels.job_id }}"
          description: "{{ $labels.job_id }} 가 자기 주기의 1.5배({{ $value | humanizeDuration }}) 동안 발화하지 않았습니다. 락/DB 게이트로 조용히 스킵되는지, 스케줄러 로그와 `python3 -m src.cli.kbo incidents list` 를 확인하세요."
          runbook: "Docs/runbooks/DATA_RELIABILITY.md"

      # `KBOSchedulerJobNotRunning` above cannot see the case this one exists
      # for. The heartbeat is stamped at submission, so a job a gate skips on
      # *every* tick still looks like a job that fired -- and because the gates
      # return quietly, APScheduler reports each skip as a success, so
      # `kbo_scheduler_job_total` moves as well. Both signals are true about
      # different things (the scheduler reached the job; the job function
      # returned) and neither means any work happened.
      #
      # A streak rather than a rate: reset by any run that executed, incremented
      # by a run a gate skipped, so `> 0` reads as "the last attempt did no
      # work". One tick of lock contention clears itself on the next tick; an
      # hour is long enough that a job still above zero is not recovering.
      # Severity is `warning` for the reason `KBOLockSkipSpike` is -- the cause
      # is usually contention, and paging for it teaches operators to ignore the
      # rule. A database that is actually down raises `KBODatabaseUnavailable`
      # beside this.
      - alert: KBOSchedulerJobSkipped
        expr: kbo_scheduler_job_consecutive_skips > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "KBO 스케줄러 작업이 게이트에서 스킵됨: {{ $labels.job_id }}"
          description: "{{ $labels.job_id }} 가 락 타임아웃 또는 DB 미도달로 1시간 넘게 실행되지 않았습니다. APScheduler는 스킵을 성공으로 계상하고 하트비트도 갱신되므로, 이 규칙이 그 상태를 알리는 유일한 신호입니다. `grep 'skipped:' logs/scheduler.launchd.err.log` 와 `python3 -m src.cli.kbo incidents list` 를 확인하세요."
          runbook: "Docs/runbooks/DATA_RELIABILITY.md"

  - name: kbo_database_alerts
    rules:
      # DB availability is owned here (infrastructure path), not by the
      # in-process incident manager: the incident ledger lives in the DB itself,
      # so DB-down state cannot be persisted there.
      - alert: KBODatabaseUnavailable
        expr: kbo_db_available == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "KBO 데이터베이스 연결 불가"
          description: "SELECT 1 프로브가 1분 이상 실패했습니다. DB 연결/인증/네트워크를 확인하세요."

      - alert: KBODatabaseLatencyHigh
        expr: kbo_db_ping_latency_seconds > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "KBO 데이터베이스 응답 지연"
          description: "DB ping 지연이 5분 이상 {{ $value | humanizeDuration }} 수준입니다."
