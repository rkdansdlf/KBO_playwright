groups:
  - name: kbo_scheduler_alerts
    rules:
      - alert: KBOLockSkipSpike
        expr: sum(increase(kbo_scheduler_lock_skip_total[5m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "KBO 스케줄러 락 스킵(경합) 급증 발생"
          description: "최근 5분 동안 락 스킵 횟수가 {{ $value }}회 발생했습니다."

      - alert: KBOSchedulerJobFailed
        expr: increase(kbo_scheduler_job_total{status="failure"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "KBO 스케줄러 작업 실패"
          description: "스케줄러 작업 {{ $labels.job_id }} 이(가) 실패했습니다."
