# Crawler alert rules.
#
# Kept separate from alert_rules.yml so the scheduler/infrastructure rules and
# the data-collection rules can be reviewed independently.
#
# Every metric referenced here is defined in src/monitoring/crawler_metrics.py.
# tests/monitoring/test_crawler_alert_rules_contract.py asserts that in both
# directions, so a renamed or deleted metric fails CI rather than leaving a
# rule that silently never fires.

groups:
  - name: kbo_crawler_alerts
    rules:
      # ── Failure burst ────────────────────────────────────────────────
      # A crawler failing repeatedly is either an outage or a broken selector.
      - alert: KboCrawlerFailureBurst
        expr: sum by (crawler) (increase(kbo_crawl_failures_total[15m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "크롤러 실패 급증: {{ $labels.crawler }}"
          description: "최근 15분 동안 {{ $labels.crawler }} 실패가 {{ $value }}회 발생했습니다."

      # ── No recent complete success ───────────────────────────────────
      # The window is the crawler's own period, not a constant. Six hours was
      # the previous choice and no scheduled crawler fits inside it: a daily
      # collector was judged for the six hours after its run and silent for the
      # other eighteen, so the alert resolved and reopened once a day and its
      # silence read as health. Measured 2026-10-19 in the run ledger: `food` and
      # `seat` each run once a day. `kbo_crawl_expected_interval_seconds` is
      # published from the trigger of the job that starts the crawler, so moving
      # a job's cron moves this window with it instead of leaving it behind.
      #
      # `last_full_success`, not `last_success`: partial is a success for the
      # ledger but not for the collector, because "one source of three quietly
      # fails" keeps writing through the other two (BUG-001). A crawler stuck on
      # partial warns after 24h through KboCrawlerSustainedPartial and reaches
      # this critical once two of its own cycles pass without a clean run.
      #
      # Two conditions keep it honest:
      #   * a crawler that never succeeded exposes 0, so the age is huge and it
      #     fires from its first recorded run rather than staying silent;
      #   * a crawler that stopped running entirely is the scheduler's staleness
      #     rule's question (`KboSchedulerJobNotRunning`), so `last_run` must be
      #     recent for this rule to report. Without that guard, every retired
      #     crawler would page forever.
      # A crawler with no published interval matches nothing, deliberately: the
      # absence of a period is not a period of zero. `NOT_SCHEDULED` in
      # src/monitoring/crawler_cadence.py names which crawlers those are and why.
      - alert: KboCrawlerNoRecentSuccess
        expr: |
          (time() - kbo_crawl_last_full_success_timestamp)
            > 2 * kbo_crawl_expected_interval_seconds
          and on (crawler)
          (time() - kbo_crawl_last_run_timestamp)
            < 2 * kbo_crawl_expected_interval_seconds
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "크롤러 완전 성공 없음: {{ $labels.crawler }}"
          description: "{{ $labels.crawler }} 은(는) 자기 주기의 두 배 동안 완전 성공 없이 실행만 반복했습니다. 부분 성공이 이어지는 경우에는 24시간 경고(KboCrawlerSustainedPartial)가 먼저 울립니다. `kbo_crawl_last_partial_success_timestamp` 와 원장의 최근 결과를 확인하세요."
          runbook: "Docs/runbooks/DATA_RELIABILITY.md"

      # ── The latest run failed ────────────────────────────────────────
      # The rule above cannot answer this for two cycles: one failed run after a
      # good one leaves the last clean success inside the window, and that grace
      # is deliberate -- a 06:45 failure is usually replayed from the dead letter
      # queue within minutes. What was missing was the reading when the grace
      # runs out: `last_failure >= last_run` says the most recent terminal result
      # is a failure, and it stays true until a later run succeeds, so a single
      # missed collection cannot hide behind a stale success.
      #
      # Warning, not critical: a retry may still clear it, and the critical rung
      # is the rule above once two cycles pass without a clean run. The recency
      # guard is the same cadence window, for the same reason -- a crawler that
      # has not run since is not this rule's question.
      - alert: KboCrawlerRecentFailure
        expr: |
          (kbo_crawl_last_failure_timestamp >= kbo_crawl_last_run_timestamp)
          and on (crawler)
          (time() - kbo_crawl_last_run_timestamp)
            < 2 * kbo_crawl_expected_interval_seconds
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "크롤러 최근 실행 실패: {{ $labels.crawler }}"
          description: "{{ $labels.crawler }} 의 가장 최근 실행이 실패로 끝났습니다. DLQ 재시도가 성공하면 다음 실행에서 자동으로 해제됩니다. 원장의 error_code 와 `python3 -m src.cli.kbo dlq list --crawler {{ $labels.crawler }}` 를 확인하세요."
          runbook: "Docs/runbooks/DATA_RELIABILITY.md"

      # ── Write drop ───────────────────────────────────────────────────
      # The dangerous failure is a 200 with no exception that writes almost
      # nothing because a selector changed. The baseline is the 7-day
      # time-weighted average of the last-run write count, not a true per-run
      # average; a crawler with no history has a baseline of 0 and stays quiet.
      # Note the deliberate absence of a `> 0` guard on the current value:
      # "existed at 100, now writes 0" is the case this rule exists for.
      - alert: KboCrawlerWriteDrop
        expr: |
          (avg_over_time(kbo_crawl_records_written_last[7d]) > 0)
          and on (crawler)
          (
            kbo_crawl_records_written_last
              < 0.2 * avg_over_time(kbo_crawl_records_written_last[7d])
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "크롤러 쓰기 급감: {{ $labels.crawler }}"
          description: "{{ $labels.crawler }} 의 최근 쓰기 건수가 7일 기준의 20% 미만으로 떨어졌습니다. selector 변경 가능성을 확인하세요."

      # ── Sustained partial ────────────────────────────────────────────
      # This is the early rung of the case the rule above reaches late. Partial is
      # in SUCCESS_STATUSES, so a crawler that partially fails every day keeps
      # advancing `kbo_crawl_last_success_timestamp`; and "one source of three
      # quietly fails" keeps writing through the other two, so the write-drop
      # rule stays healthy too. KboCrawlerNoRecentSuccess thresholds on *full*
      # success and does see it, but only after two of the crawler's own cycles
      # -- for a daily collector that is day three. Twenty-four hours of
      # partial-only is already worth a warning, so this rule reads the outcome
      # mix directly (BUG-001).
      #
      # `unless` rather than `== 0` on the success side is deliberate. A
      # crawler that has never recorded a success has no success series at all,
      # and `increase()` over a missing series yields no sample to compare --
      # the longest-running degradation would be exactly the case the rule
      # stays silent for. `unless` drops the partial only when a success
      # sample actually exists.
      #
      # The 24h window follows the daily pipeline cadence (03:00-06:45 KST),
      # the same schedule-derived choice as KboDlqBacklogAgeHigh. It also gives
      # a daily crawler one full cycle of grace: after a single partial day,
      # yesterday's success is still inside the window and nothing pages. No
      # production sample was available when this rule was written (BUG-001);
      # re-measure before treating the window as calibrated.
      - alert: KboCrawlerSustainedPartial
        expr: |
          (sum by (crawler) (increase(kbo_crawl_runs_total{status="partial"}[24h])) > 0)
          unless on (crawler)
          (sum by (crawler) (increase(kbo_crawl_runs_total{status="success"}[24h])) > 0)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "크롤러 지속 부분 성공: {{ $labels.crawler }}"
          description: "{{ $labels.crawler }} 은(는) 24시간 동안 완전 성공 없이 partial 실행만 기록했습니다. 일부 소스만 실패하는 저하가 이어지고 있을 수 있으니 소스별 결과와 DLQ를 확인하세요."
          runbook: "Docs/runbooks/DATA_RELIABILITY.md"

      # ── A source that is never consulted ─────────────────────────────
      # A compliance or robots decision that skips a fetch is recorded as
      # `success` -- deliberately, because nothing failed -- and that status also
      # advances `kbo_crawl_last_success_timestamp`. So a crawler that is skipped
      # on every run looks permanently healthy to `KboCrawlerNoRecentSuccess`,
      # and a source that stopped answering is indistinguishable from one that
      # was never asked (BUG-014).
      #
      # Measured: `roster_transactions` and `player_movement` were skipped on
      # every run from 2026-10-07 while their domain tables held no rows after
      # 2026-08-16. No alert could see it.
      #
      # The rule reads `kbo_crawl_last_source_consulted_timestamp`, which only a
      # run that actually asked sets -- climbing it back onto `last_success`
      # would reproduce the defect. The run guard is the same cadence-derived
      # window as KboCrawlerNoRecentSuccess: a crawler that stopped running
      # entirely is that rule's business, and reporting it here too would
      # double-page. The previous guard was `increase(kbo_crawl_runs_total[6h])`,
      # which made a daily crawler skipped for weeks raise a warning that
      # resolved and reopened every day -- the same six-hour defect, and the same
      # noise this file's DLQ rules were cleaned of.
      #
      # 48h rather than the cadence window: these crawlers run daily, so two
      # missed days is already a change in behaviour rather than a blip, and the
      # threshold is also long enough that a transient robots decision cannot
      # reach it. Warning, not critical, because being blocked by policy is not
      # the same as being broken -- the reader decides whether the block is
      # acceptable, and the decision is recorded in the runbook rather than in
      # the alert's severity.
      - alert: KboCrawlerSourceNeverConsulted
        expr: |
          (time() - kbo_crawl_last_source_consulted_timestamp > 172800)
          and on (crawler)
          (time() - kbo_crawl_last_run_timestamp)
            < 2 * kbo_crawl_expected_interval_seconds
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "크롤러 소스 미조회: {{ $labels.crawler }}"
          description: "{{ $labels.crawler }} 은(는) 48시간 넘게 소스를 한 번도 조회하지 않았습니다. 실행은 계속되고 있으므로 정지가 아니라 준법·robots 정책으로 건너뛰고 있을 가능성이 높습니다. `kbo_crawl_source_limited_total` 로 사유를 확인하고, 그 차단이 수용 가능한지 판단하세요."
          runbook: "Docs/runbooks/DATA_RELIABILITY.md"

      # ── Ledger lifecycle failure ─────────────────────────────────────
      # A crawl can fail cleanly and still leave nothing behind. If the run row
      # was never opened, or its terminal transition was never committed, the
      # game's real outcome is not in the ledger -- and `kbo_crawl_failures_total`
      # cannot see that, because it only counts runs that exist.
      #
      # This is why the alert exists on a counter rather than on a DLQ backlog:
      # a DLQ entry proves a failure was recorded; an absent DLQ entry with an
      # unfinished run proves the bookkeeping itself is broken.
      #
      # `sum by (crawler, operation)` is load-bearing: without it the series
      # carries `error_code` too, so one crawler raises the same alert under a
      # different label set per error code, which breaks grouping and dedup.
      - alert: KboCrawlLedgerFailure
        expr: sum by (crawler, operation) (increase(kbo_crawl_ledger_failures_total[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "크롤링 원장 기록 실패: {{ $labels.crawler }} ({{ $labels.operation }})"
          description: "{{ $labels.crawler }} 의 {{ $labels.operation }} 단계가 최근 10분 동안 {{ $value }}회 실패했습니다. 해당 경기의 결과가 원장에 남아 있지 않습니다."

      # The same signal, sustained. A single ledger failure is usually a
      # transient connection blip; repeats mean the connection is bad or the
      # ledger write itself is broken, which is worth waking someone for.
      - alert: KboCrawlLedgerFailureSustained
        expr: sum by (crawler, operation) (increase(kbo_crawl_ledger_failures_total[1h])) >= 5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "크롤링 원장 기록 지속 실패: {{ $labels.crawler }} ({{ $labels.operation }})"
          description: "{{ $labels.crawler }} 의 {{ $labels.operation }} 단계가 최근 1시간 동안 {{ $value }}회 실패했습니다. DB 연결과 원장 쓰기 경로를 확인하세요."

      # ── Dead letter recovery stalled ────────────────────────────────
      # `kbo_crawl_failures_total` reports that a crawl failed. It says nothing
      # about whether the failure was ever *recovered*, which is the whole point
      # of the dead letter queue: a letter is enqueued, a worker retries it, and
      # the letter resolves.
      #
      # A letter stranded in `retrying` means the worker claimed it and then the
      # process died mid-replay -- the state is transient by design, so it is
      # only meaningful once it has outlived the staleness cutoff
      # (DLQ_STALE_RETRYING_SECONDS, default 1800s). `crawl_dead_letter_recovery`
      # exists to reconcile exactly this condition, every 30 minutes.
      #
      # The threshold is `> 0` rather than a rate or a count because every other
      # rule in this file is about volume, and volume is the wrong question here.
      # One stuck letter is already a stopped recovery: there is no healthy
      # amount of stranded work. A rate-based threshold would need a baseline to
      # compare against, and the baseline for "letters per run" is the variable
      # being investigated.
      #
      # `for: 1m` matches KBODatabaseUnavailable. It is not a debounce -- it is
      # there so a scheduler restart, which briefly leaves the gauge stale from
      # the previous process, cannot page someone on the way back up.
      - alert: KboDlqRecoveryStalled
        expr: kbo_crawl_dlq_stale_retrying_letters > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "크롤링 실패 복구 정체: {{ $value }}건이 retrying에 묶임"
          description: "{{ $value }}건의 dead letter가 DLQ_STALE_RETRYING_SECONDS(기본 1800초)를 넘겨 retrying 상태에 있습니다. replay 중 프로세스가 종료되었을 수 있습니다. `python3 -m src.cli.kbo dlq list --status retrying` 로 확인하고, `crawl_dead_letter_recovery` 잡이 실행 중인지 점검하세요."
          runbook: "Docs/runbooks/DATA_RELIABILITY.md"

      # ── Worker backlog age ──────────────────────────────────────────
      # Distinct from the stall above: the worker may be running perfectly while
      # the queue simply grows faster than one retry per 10 minutes can drain it.
      # That is a throughput problem, not a crash, and the two need different
      # responses -- so this reads the oldest due letter's age instead of the
      # stranded count.
      #
      # The threshold is 24h because a letter is worth retrying for days: the
      # backoff schedule runs 60s/300s/900s/3600s across a five-attempt budget,
      # so a letter being a day overdue is normal backlog, while a week overdue
      # means the drain is not keeping up. This value was chosen from the retry
      # schedule rather than from observed production data -- no production
      # sample was available when the rule was written (BUG-002). Re-measure
      # `kbo_crawl_dlq_oldest_due_age_seconds` over a real week before treating
      # this number as calibrated.
      - alert: KboDlqBacklogAgeHigh
        expr: kbo_crawl_dlq_oldest_due_age_seconds > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "크롤링 실패 회수 대기 열화: 최장 {{ $value | humanizeDuration }}"
          description: "가장 오래된 대기 중 dead letter가 {{ $value | humanizeDuration }} 동안 회수되지 않았습니다. 10분 주기 재시도가 큐를 따라가지 못하는 상태일 수 있습니다. `python3 -m src.cli.kbo dlq stats` 로 백로그를 확인하세요."
          runbook: "Docs/runbooks/DATA_RELIABILITY.md"

      # ── The sweep itself is not running ─────────────────────────────
      # Every rule above reads a gauge the dead letter sweep refreshes. A sweep
      # that cannot reach the database leaves the previous values in place rather
      # than zeroing them, so an empty queue and an unreadable one produce
      # identical readings. That ambiguity is the reason this exists: without a
      # heartbeat, "there is nothing to reprocess" and "nobody has been able to
      # look" are the same dashboard.
      #
      # Phrased as an age so a gauge that has never been set needs no separate
      # rule: at 0 the expression reads as maximally stale, which is exactly
      # what "no sweep has ever succeeded" means. `crawl_dead_letter_recovery`
      # also refreshes on scheduler startup, so a fresh process publishes a
      # timestamp within seconds -- remaining at 0 past `for` is a real fault,
      # not a boot.
      #
      # 2 hours is four times the 30-minute tick. It is deliberately loose
      # because the failure it reports is "the observer is gone", and a busy
      # maintenance window can defer a tick past one interval; the cost of being
      # late here is one missed detection, while paging on every deferral would
      # train the reader to ignore it. Not yet calibrated against production
      # (BUG-002) -- the tick interval is the basis, not a measurement.
      #
      # `max()` is load-bearing, not decoration. The gauge is label-less and
      # lives in the shared metrics module, so every process that imports it
      # exports a series of its own -- the API server's `/metrics` serves the
      # same default registry -- and only the scheduler ever advances it. Read
      # per series, that never-set 0 is permanently older than the allowance and
      # the rule fires on a healthy system: measured 2026-10-19, it had been
      # firing since the previous evening (`{job="kbo-api-server"}` at 0 while
      # `{job="kbo-scheduler"}` was current), which is exactly the noise that
      # hides a real stall. Aggregating restores the intended reading, "when did
      # anyone last manage to look at the queue", and unlike filtering on the
      # scheduler's job label it still fires if that series disappears with the
      # scheduler -- the case where the heartbeat matters most.
      - alert: KboDlqSweepStalled
        expr: time() - max(kbo_crawl_dlq_last_successful_sweep_timestamp) > 7200
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "DLQ 스위프 정지: {{ $value | humanizeDuration }} 동안 큐를 읽지 못함"
          description: "최근 {{ $value | humanizeDuration }} 동안 dead letter 큐를 한 번도 읽지 못했습니다. 큐 상태를 알 수 없으므로 DLQ 지표는 이전 값에 고정되어 있습니다. `crawl_dead_letter_recovery` 잡과 DB 연결을 점검하세요."
          runbook: "Docs/runbooks/DATA_RELIABILITY.md"

      # The other half: the sweep ran and failed, which is a different fault from
      # the sweep not running at all. Warning rather than critical, because the
      # usual cause -- an unreachable database -- already pages through
      # KBODatabaseUnavailable, and two criticals for one outage trains the
      # reader to treat a page as noise. What is new here is the narrower case:
      # the database is reachable but this read is not.
      - alert: KboDlqSweepFailing
        expr: increase(kbo_crawl_dlq_sweep_failures_total[30m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          # Rounded because `increase()` extrapolates over the window and reports
          # 3.0625 where three sweeps failed. A count of unreadable sweeps
          # cannot be fractional, so printing the artifact would be noise that
          # also makes the annotation unmatchable in a rule test.
          summary: "DLQ 스위프 실패: 30분 내 {{ $value | printf \"%.0f\" }}회 큐 읽기 실패"
          description: "최근 30분 동안 dead letter 큐 읽기가 {{ $value | printf \"%.0f\" }}회 실패했습니다. DB는 살아있지만 큐를 못 읽는 상태일 수 있으므로, DLQ 지표가 정상으로 보여도 실제로는 갱신되지 않았을 수 있습니다. `python3 -m src.cli.kbo dlq stats` 로 직접 확인하세요."
          runbook: "Docs/runbooks/DATA_RELIABILITY.md"
