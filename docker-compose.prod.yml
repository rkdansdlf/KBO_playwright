# Production stack.
#
# Differences from docker-compose.dev.yml, and why:
#
#   * No observability port is published. Prometheus, Alertmanager, Grafana, and
#     browserless listen on the internal `kbo-internal` network only. In dev
#     they are published because iterating on a dashboard is the point; in
#     production reaching them is a network decision, not a compose one.
#   * Grafana anonymous access is off and the admin password is required. The
#     dev default of `admin` plus anonymous Viewer must never survive a deploy.
#   * No PostgreSQL service. Oracle Autonomous Database is the production store;
#     the postgres image only ever existed for local acceptance.
#   * No pgvector service. Dense embeddings live in Oracle's native VECTOR.
#   * The API is published because it is the only ingress; bind it to a reverse
#     proxy or a VPN rather than exposing it directly.
#
# Required environment:
#   DATABASE_URL            Oracle Autonomous Database URL
#   ORACLE_WALLET_HOST_PATH  Host path to the Oracle Wallet
#   GRAFANA_ADMIN_PASSWORD  Grafana admin password (no default)
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Every image is pinned to a digest; see Docs/references/COMPOSE_IMAGE_LOCK.md.

services:
  scheduler:
    build: .
    restart: always
    container_name: kbo_scheduler
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the Oracle Autonomous Database}
      TNS_ADMIN: /run/oracle-wallet
      RUN_INIT_DB: "1"
      CHOWN_BIND_MOUNTS: "0"
      SQLITE_STARTUP_GUARD: "0"
      SQLITE_CORRUPT_ACTION: ${SQLITE_CORRUPT_ACTION:-quarantine}
      SQLITE_SYNCHRONOUS: ${SQLITE_SYNCHRONOUS:-FULL}
      PLAYWRIGHT_WS_ENDPOINT: ws://browserless:3000/chromium/playwright
    depends_on:
      browserless:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ${ORACLE_WALLET_HOST_PATH:?ORACLE_WALLET_HOST_PATH must point to the Oracle Wallet}:/run/oracle-wallet:ro
      - playwright-browsers:/ms-playwright
    networks:
      - kbo-internal
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy import text; from src.db.engine import Engine; conn = Engine.connect(); conn.execute(text('SELECT 1')); conn.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["python", "-m", "scripts.scheduler"]

  api-server:
    build: .
    restart: always
    container_name: kbo_api_server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the Oracle Autonomous Database}
      TNS_ADMIN: /run/oracle-wallet
      RUN_INIT_DB: "1"
      CHOWN_BIND_MOUNTS: "0"
      SQLITE_STARTUP_GUARD: "0"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ${ORACLE_WALLET_HOST_PATH:?ORACLE_WALLET_HOST_PATH must point to the Oracle Wallet}:/run/oracle-wallet:ro
    ports:
      # The only published port. Put a reverse proxy or VPN in front of it.
      - "127.0.0.1:8000:8000"
    networks:
      - kbo-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: ["python", "-m", "src.cli.run_api_server", "--host", "0.0.0.0", "--port", "8000"]

  browserless:
    image: ghcr.io/browserless/chromium:latest@sha256:ae07025606e03c9b263620aaf4d09c52728f71a104ac7d471a68c23dec72c05f
    restart: always
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=300000
      - KEEP_ALIVE=true
    networks:
      - kbo-internal

  prometheus:
    image: prom/prometheus:latest@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: always
    container_name: kbo_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - scheduler
    networks:
      - kbo-internal

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    restart: always
    container_name: kbo_alertmanager
    secrets:
      - source: telegram_bot_token
        target: telegram_bot_token
      - source: telegram_chat_id
        target: telegram_chat_id
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - kbo-internal

  grafana:
    image: grafana/grafana:latest@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    restart: always
    container_name: kbo_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set for production}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - kbo-internal

secrets:
  telegram_bot_token:
    environment: TELEGRAM_BOT_TOKEN
  telegram_chat_id:
    environment: TELEGRAM_CHAT_ID

networks:
  kbo-internal:
    driver: bridge

volumes:
  playwright-browsers:
  prometheus-data:
  alertmanager-data:
  grafana-data:
