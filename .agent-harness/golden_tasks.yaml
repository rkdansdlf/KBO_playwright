schema_version: "1"

# P18에서 라우터 intent precedence를 도입해 collision 4건을 모두 해소했다.
# (architecture-dataflow, refactor-parser-utils, research-playwright-latest는 라우터 수정으로,
#  feature-retry-policy는 crawler 파일 변경이므로 crawler-bug가 정답이라는 판단으로 기대값을 정정했다.)
#
# 새 collision은 예외 없이 suite 실패로 남아야 하므로 이 목록은 비어 있어야 한다.
# feature-retry-policy의 분류 판단 근거:
#   prompts에 "추가"만 있고 strong intent marker가 없으며, changed_files가
#   src/crawlers/retry_policy.py이므로 crawler 프로파일이 올바른 결과다.
known_deviations: []

tasks:
  - task_id: crawler-boxscore-timeout
    title: "boxscore crawler timeout 원인 조사"
    category: crawler-bug
    risk: normal
    round: 1
    request:
      prompt: "boxscore crawler timeout 원인 조사"
      changed_files: ["src/crawlers/game_boxscore_crawler.py"]
    expected:
      profile: crawler-bug
      skills: [graphify, superpowers, ponytail, i-have-adhd]
      verification: crawler
      level: standard
      checks: [pytest-affected, ruff-project, crawler-gate]
      permission: {action: none, decision: not_applicable}

