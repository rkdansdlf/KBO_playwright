version: 1

read:
  deny:
    - .env
    - "**/*.pem"
    - "**/*.key"
    - "**/*wallet*"
    - "**/cwallet.sso"
    - "**/ewallet.p12"
  restricted:
    - "data/**/*.db"
    - "logs/**"

redact_env:
  - DATABASE_URL
  - OCI_WALLET_PASSWORD
  - YOUTUBE_API_KEY
  - NAVER_CLIENT_ID
  - NAVER_CLIENT_SECRET
  - TELEGRAM_BOT_TOKEN
  - SLACK_WEBHOOK_URL

write:
  default: false
  allowed:
    - "artifacts/agent-harness/**"
    - ".opencode/plans/**"
    - "Docs/plans/**"

network:
  default: false
  allowed_skills:
    - last30days

commands:
  allowed_executables:
    - graphify
    - aas
    - pytest
    - ruff
    - mypy
    - python3
    - git
  python_modules:
    - pytest
    - ruff
    - mypy
    - tools.agent_harness
    - src.cli.crawler_selector_gate
    - src.cli.data_quality_regression_pack
  forbidden_flags:
    - "--shell"
