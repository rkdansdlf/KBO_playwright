version: 1

read:
  deny:
    - .env
    - "**/.env"
    - "**/*.pem"
    - "**/*.key"
    - "**/*wallet*"
    - "**/cwallet.sso"
    - "**/ewallet.p12"
  restricted:
    - "data/**/*.db"
    - "logs/**"

redact_env:
  - DATABASE_URL
  - OCI_DB_URL
  - ORACLE_TARGET_URL
  - RAG_SOURCE_DB_URL
  - RAG_INDEX_DB_URL
  - ORACLE_APP_PASSWORD
  - OCI_WALLET_PASSWORD
  - POSTGRES_PASSWORD
  - PGVECTOR_PASSWORD
  - KBO_USER_ID
  - KBO_USER_PWD
  - YOUTUBE_API_KEY
  - OPENROUTER_API_KEY
  - BEGA_PROD_PASSWORD
  - SEOUL_OPEN_DATA_API_KEY
  - KAKAO_REST_API_KEY
  - NAVER_CLIENT_ID
  - NAVER_CLIENT_SECRET
  - TMAP_API_KEY
  - TELEGRAM_BOT_TOKEN
  - SLACK_WEBHOOK_URL
  - SENTRY_DSN

environment:
  denied:
    - BASH_ENV
    - CDPATH
    - ENV
  denied_prefixes:
    - DYLD_
    - GIT_
    - LD_
    - PYTEST_
    - PYTHON

write:
  default: false
  allowed:
    - "artifacts/agent-harness/**"
    - ".opencode/plans/**"
    - "Docs/plans/**"

network:
  default: false
  allowed_skills:
    - last30days

commands:
  allowed_executables:
    - graphify
    - aas
    - pytest
    - ruff
    - mypy
    - python3
    - git
  python_modules:
    - pytest
    - ruff
    - mypy
    - tools.agent_harness
    - src.cli.crawler_selector_gate
    - src.cli.data_quality_regression_pack
    # Repository gate entrypoints invoked as modules. `python scripts/x.py` is denied by
    # the -m rule, so the module form is the only allowlisted way to reach a script gate.
    - scripts.check_mypy_scoped
    - scripts.lint_unreachable_code
    - scripts.lint_bare_except
  forbidden_flags:
    - "--shell"
