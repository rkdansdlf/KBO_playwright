version: 1

# Verification gate policy.
#
# `gates` is the single vocabulary of verification gates. The catalog in
# tools/agent_harness/verifier.py knows how to run each gate id; this file decides which
# gates a level or profile requires. Both `verify <run-id>` (profile mode) and
# `verify <run-id> --level <L>` (level mode) resolve through the same catalog, so there is
# one source of truth for "which checks run".
#
# Gate ids: pytest-affected, pytest-full, ruff-changed, ruff-project, format-check,
#           mypy-scoped, crawler-gate, doctor
#
# Every level except `none` runs `doctor`, because `doctor` is the only gate that validates
# the Harness manifest and policies themselves. A refactor that edits .agent-harness/ used
# to skip it, which inverted the risk ordering.
#
# `certification` is intentionally absent. It needs a live database, so it is a separate
# manual gate (`kbo certify`) and not a Harness verification gate.

levels:
  none:
    description: "No automated checks (research-only routes)."
    gates: []
  quick:
    description: "Affected pytest plus a changed-scope lint."
    gates: [pytest-affected, ruff-changed, doctor]
  standard:
    description: "Affected pytest plus project lint, with a conditional crawler gate."
    gates: [pytest-affected, ruff-project, doctor]
    conditional_gates:
      crawler-gate: crawler_changed
  full:
    description: "Full suite plus the repository lint contract."
    gates: [pytest-full, ruff-project, format-check, mypy-scoped, doctor]

profiles:
  project:
    level: standard
  crawler:
    level: standard
    always_gates: [crawler-gate, pytest-crawler-gate]
  analytics:
    level: standard
    extra_pytest_targets: [tests/analytics]
  research:
    description: "Research routes only re-validate the Harness manifest."
    gates: [doctor]
  full:
    level: full
